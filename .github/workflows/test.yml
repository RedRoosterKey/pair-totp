name: Tests

on:
  push:
  pull_request:

# Read-only: the tests only need to check out the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a commit rather than a tag, so a moved tag can't change what runs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The runner image already has Node and Python; the tests need nothing else.
      - run: node --version
      - run: node --test
      - run: python3 tools/update-sri.py --check
